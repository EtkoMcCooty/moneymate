name: moneymate
description: "MoneyMate - Personal finance tracker replacing rigid spreadsheets with interactive tracking and analytics."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  csv: ^8.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  file_picker: ^13.3.3
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.11.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
