name: Continuous Delivery & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Verify & Build Release Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static Analysis & Test Suite
        run: |
          flutter analyze
          flutter test

      - name: Build Release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
        run: flutter build apk --release --build-number=${{ github.run_number }} --android-skip-build-dependency-validation

      - name: Upload Release APK Artefact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Release APK Artefact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-assets/

      - name: Determine Release Tag & Metadata
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.1.0+${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Release ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          CLEAN_TAG="${TAG#v}"
          NOTES=""

          # 1. Try to extract matching version section from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v tag="$TAG" -v ctag="$CLEAN_TAG" '
              index($0, "## [" tag "]") == 1 || index($0, "## [" ctag "]") == 1 { flag=1; next }
              flag && /^## \[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md | sed -e '/^[[:space:]]*$/d')
          fi

          # 2. If nothing extracted for exact tag, check if there are notes under [Unreleased]
          if [ -z "$NOTES" ] && [ -f CHANGELOG.md ]; then
            UNRELEASED_NOTES=$(awk '
              /^## \[Unreleased\]/ { flag=1; next }
              flag && /^## \[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md | sed -e '/^[[:space:]]*$/d' | grep -v 'Upcoming features and improvements' || true)
            if [ -n "$UNRELEASED_NOTES" ]; then
              NOTES="$UNRELEASED_NOTES"
            fi
          fi

          # 3. Fallback: Parse and sanitise git commits between tags
          if [ -z "$NOTES" ]; then
            TARGET_REF="$TAG"
            if ! git rev-parse --verify "${TARGET_REF}" >/dev/null 2>&1; then
              TARGET_REF="HEAD"
            fi
            PREV_TAG=$(git describe --tags --abbrev=0 "${TARGET_REF}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              RAW_COMMITS=$(git log "${PREV_TAG}..${TARGET_REF}" --pretty=format:"%s" --no-merges)
            else
              RAW_COMMITS=$(git log -n 10 "${TARGET_REF}" --pretty=format:"%s" --no-merges)
            fi

            NOTES=$(echo "$RAW_COMMITS" | while IFS= read -r line; do
              [ -z "$line" ] && continue
              # Filter out internal developer commits
              if echo "$line" | grep -qiE '^(chore|ci|docs|test|style|Merge)\b'; then
                continue
              fi
              # Check for hotfix
              if echo "$line" | grep -qiE '^(hotfix|fix\([^)]*hotfix[^)]*\))'; then
                cleaned=$(echo "$line" | sed -E 's/^(hotfix|fix\([^)]*hotfix[^)]*\)):\s*//I' | sed -E 's/\s*\([#0-9, ]+\)$//')
                echo "- hotfix: $cleaned"
              elif echo "$line" | grep -qiE '^(feat|fix|perf|refactor)\([^)]*\):'; then
                cleaned=$(echo "$line" | sed -E 's/^(feat|fix|perf|refactor)\([^)]*\):\s*//I' | sed -E 's/\s*\([#0-9, ]+\)$//')
                first="$(echo "${cleaned:0:1}" | tr '[:lower:]' '[:upper:]')"
                rest="${cleaned:1}"
                echo "- ${first}${rest}"
              else
                echo "- $line"
              fi
            done)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- General performance improvements and bug fixes."
          fi

          {
            echo "notes<<__CHANGELOG_EOF__"
            echo "### 🚀 What's New"
            echo "$NOTES"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with Sideload APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          prerelease: false
          generate_release_notes: false
          body: ${{ steps.changelog.outputs.notes }}
          files: release-assets/*.apk
