name: CI/CD Pipeline (Mobile & APK Release)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & Lint
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    name: Publish Release APK
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-build

      - name: Determine Release Tag & Metadata
        id: release_info
        env:
          HAS_PAT: ${{ secrets.RELEASES_PAT != '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}-v${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=PR #${{ github.event.pull_request.number }} Preview (Build ${{ github.run_number }})" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "target_repo=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "commitish=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.1.0+${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=Release v0.1.0+${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            if [ "$HAS_PAT" = "true" ]; then
              echo "target_repo=EtkoMcCooty/moneymate-releases" >> $GITHUB_OUTPUT
              echo "commitish=main" >> $GITHUB_OUTPUT
            else
              echo "target_repo=${{ github.repository }}" >> $GITHUB_OUTPUT
              echo "commitish=${{ github.sha }}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create GitHub Release with Sideload APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ steps.release_info.outputs.target_repo }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          target_commitish: ${{ steps.release_info.outputs.commitish }}
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          body: |
            Automated MoneyMate build for ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'official release' }}.
            
            ### 📱 Download & Sideload
            Direct APK download: [app-release.apk](app-release.apk)
          files: release-build/*.apk
