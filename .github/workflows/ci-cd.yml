name: CI/CD Pipeline (Mobile & APK Release)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & Lint
        run: flutter analyze

      - name: Run Test Suite
        run: |
          set -o pipefail
          flutter test --reporter=expanded 2>&1 | tee test-results.log

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-log
          path: test-results.log

      - name: Build Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    name: Publish Release APK
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-build

      - name: Determine Release Tag & Metadata
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}-v${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=PR #${{ github.event.pull_request.number }} Preview (Build ${{ github.run_number }})" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.1.0+${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=Release v0.1.0+${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          CLEAN_TAG="${TAG#v}"
          NOTES=""

          # 1. Try to extract matching version section from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v tag="$TAG" -v ctag="$CLEAN_TAG" '
              $0 ~ "^## \\[" (tag|ctag) "\\]" { flag=1; next }
              flag && /^## \\[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md | sed -e '/^[[:space:]]*$/d')
          fi

          # 2. If nothing extracted for exact tag, check if there are notes under [Unreleased]
          if [ -z "$NOTES" ] && [ -f CHANGELOG.md ]; then
            UNRELEASED_NOTES=$(awk '
              /^## \[Unreleased\]/ { flag=1; next }
              flag && /^## \[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md | sed -e '/^[[:space:]]*$/d' | grep -v 'Upcoming features and improvements' || true)
            if [ -n "$UNRELEASED_NOTES" ]; then
              NOTES="$UNRELEASED_NOTES"
            fi
          fi

          # 3. Fallback: Parse and sanitize git commits
          if [ -z "$NOTES" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              RAW_COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s" --no-merges)
            else
              RAW_COMMITS=$(git log -n 10 --pretty=format:"%s" --no-merges)
            fi

            NOTES=$(echo "$RAW_COMMITS" | while IFS= read -r line; do
              [ -z "$line" ] && continue
              # Filter out internal developer commits
              if echo "$line" | grep -qiE '^(chore|ci|docs|test|style|Merge)\b'; then
                continue
              fi
              # Check for hotfix
              if echo "$line" | grep -qiE '^(hotfix|fix\([^)]*hotfix[^)]*\))'; then
                cleaned=$(echo "$line" | sed -E 's/^(hotfix|fix\([^)]*hotfix[^)]*\)):\s*//I' | sed -E 's/\s*\([#0-9, ]+\)$//')
                echo "- hotfix: $cleaned"
              elif echo "$line" | grep -qiE '^(feat|fix|perf|refactor)\([^)]*\):'; then
                cleaned=$(echo "$line" | sed -E 's/^(feat|fix|perf|refactor)\([^)]*\):\s*//I' | sed -E 's/\s*\([#0-9, ]+\)$//')
                # Capitalize first character
                first="$(echo "${cleaned:0:1}" | tr '[:lower:]' '[:upper:]')"
                rest="${cleaned:1}"
                echo "- ${first}${rest}"
              else
                echo "- $line"
              fi
            done)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- General performance improvements and bug fixes."
          fi

          {
            echo "notes<<EOF"
            echo "### 🚀 What's New"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release with Sideload APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          generate_release_notes: false
          body: ${{ steps.changelog.outputs.notes }}
          files: release-build/*.apk
